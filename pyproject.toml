[build-system]
requires = ["setuptools>=68,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-multimodal-system"
version = "0.1.0"
description = "Offline-first multimodal + dialogue + federated adapter runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "setuptools>=68,<81",
  "numpy>=1.24",
  "psutil>=5.9",
  "pyyaml>=6.0",
  "scipy>=1.10",
  "pillow>=10.0",
  "opencv-python>=4.8",
  "onnxruntime>=1.18",
  "jieba>=0.42.1",
  "pypinyin>=0.53",
  "ftfy>=6.2",
  "langdetect>=1.0.9",
  "deap>=1.4",
  "graphviz>=0.20",
  "neo4j>=5.20",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.41",
  "peft>=0.11",
  "accelerate>=0.30",
  "sentence-transformers>=3.0",
  "sentencepiece>=0.2.0",
  "tokenizers>=0.15",
  "safetensors>=0.4",
  "torch-geometric>=2.5",
]
federated = [
  "aiohttp>=3.9",
  "pyzmq>=25.1",
  "prefect>=2.14",
  "phe>=1.5.0",
]
rag = [
  "sentence-transformers>=3.0",
  "neo4j>=5.20",
]
dev = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
]
computer = [
  "playwright>=1.52",
  "pytesseract>=0.3.10",
  "rapidocr-onnxruntime>=1.3.0",
  "pywinauto>=0.6.8; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q --maxfail=1 --disable-warnings --cov=system --cov=perception --cov=scripts --cov=config --cov=core --cov=memory --cov=utils --cov-report=term-missing --cov-report=xml"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
  "config*",
  "core*",
  "memory*",
  "modules*",
  "perception*",
  "rules*",
  "scripts*",
  "system*",
  "utils*",
]
exclude = [
  "artifacts*",
  "audit*",
  "checkpoints*",
  "docs*",
  "tests*",
]
namespaces = true

[tool.coverage.run]
branch = true
source = ["system", "perception", "scripts", "config", "core", "memory", "utils"]

[tool.coverage.report]
skip_covered = true
show_missing = true
